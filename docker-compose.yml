# Portainer: Compose path = docker-compose.yml (raíz del repo)
# Build context = raíz de Ecunexo_cliente
# Stack: postgres + API tenant + SPA admin

name: ecunexo-cliente

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLIENTE_POSTGRES_DB:-${POSTGRES_DB:-ecunexo}}
      POSTGRES_USER: ${CLIENTE_POSTGRES_USER:-${POSTGRES_USER:-ecunexo}}
      POSTGRES_PASSWORD: ${CLIENTE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}}
    volumes:
      - cliente_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CLIENTE_POSTGRES_USER:-${POSTGRES_USER:-ecunexo}} -d ${CLIENTE_POSTGRES_DB:-${POSTGRES_DB:-ecunexo}}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cliente

  api:
    build:
      context: .
      dockerfile: ecunexo_api/Dockerfile
    image: ${CLIENTE_API_IMAGE:-ecunexo-cliente-api:1.0.0}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}
      Database__SeedCatalogOnStartup: ${DATABASE_SEED_CATALOG_ON_STARTUP:-true}
      ConnectionStrings__Default: ${CLIENTE_DATABASE_CONNECTION_STRING:-${DATABASE_CONNECTION_STRING:-Host=${CLIENTE_POSTGRES_HOST:-${POSTGRES_HOST:-postgres}};Port=${CLIENTE_POSTGRES_PORT:-${POSTGRES_PORT:-5432}};Database=${CLIENTE_POSTGRES_DB:-${POSTGRES_DB:-ecunexo}};Username=${CLIENTE_POSTGRES_USER:-${POSTGRES_USER:-ecunexo}};Password=${CLIENTE_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}}}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-}
      Smtp__UseSsl: ${SMTP_USE_SSL:-}
      Smtp__UserName: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__SenderEmail: ${SMTP_SENDER_EMAIL:-}
      Smtp__SenderName: ${SMTP_SENDER_NAME:-}
      Jwt__Issuer: ${JWT_ISSUER:-EcuNexo}
      Jwt__Audience: ${JWT_AUDIENCE:-EcuNexo.Api}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-CAMBIA_ESTO_MINIMO_32_CARACTERES_ALEATORIOS!!}
      ActivationCodes__Pepper: ${ACTIVATION_PEPPER:-CAMBIA_PEPPER_ACTIVACION_MIN_16}
      LicenseValidation__ValidationPepper: ${VALIDATION_PEPPER:-CAMBIA_ESTO_EN_PRODUCCION_PEPPER_VALIDACION_LICENCIAS_16_CHARS}
      LicenseValidation__SigningPublicKeyPath: ${LICENSE_PUBLIC_KEY_PATH:-license-public.pem}
      LicenseValidation__PlatformApiBaseUrl: ${PLATFORM_API_BASE_URL:-}
      LicenseValidation__PlatformApiKey: ${PLATFORM_API_KEY:-}
      BillingTaxRates__BaseUrl: ${BILLING_TAX_RATES_BASE_URL:-}
      InventoryEgress__ApiKey: ${INVENTORY_EGRESS_API_KEY:-}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-}
      Storage__Provider: ${STORAGE_PROVIDER:-BackblazeB2}
      Storage__ServiceUrl: ${STORAGE_SERVICE_URL:-https://s3.us-east-005.backblazeb2.com}
      Storage__Region: ${STORAGE_REGION:-us-east-005}
      Storage__PublicBucket: ${STORAGE_PUBLIC_BUCKET:-ecunexo-publico-assets}
      Storage__PrivateBucket: ${STORAGE_PRIVATE_BUCKET:-ecunexo-private-assets}
      Storage__KeyId: ${STORAGE_KEY_ID:-}
      Storage__ApplicationKey: ${STORAGE_APPLICATION_KEY:-}
    ports:
      - "${CLIENTE_API_HOST_PORT:-5088}:8080"
    networks:
      - cliente

  spa:
    build:
      context: .
      dockerfile: ecunexo_admin/Dockerfile
      args:
        # Vacío = mismo origen (Nginx proxy /api → api). Obligatorio detrás de Cloudflare HTTPS.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BILLING_API_BASE_URL: ${VITE_BILLING_API_BASE_URL:-}
        VITE_LOGNERD_ENABLE_CONSOLE: ${VITE_LOGNERD_ENABLE_CONSOLE:-false}
        VITE_LOGNERD_LEVEL: ${VITE_LOGNERD_LEVEL:-WARN}
    image: ${CLIENTE_SPA_IMAGE:-ecunexo-cliente-spa:1.0.0}
    pull_policy: build
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CLIENTE_SPA_HOST_PORT:-5173}:80"
    networks:
      - cliente       # red interna del stack: spa ↔ api
      - npm_network   # expone el contenedor al DNS de Nginx Proxy Manager

volumes:
  cliente_pg_data:

networks:
  cliente:
    driver: bridge

  # Red externa de Nginx Proxy Manager.
  # Declarar aquí garantiza que la spa se una automáticamente en cada redeploy,
  # sin necesitar 'docker network connect' manual post-deploy.
  # Nombre exacto obtenido con: docker network ls | grep nginx
  npm_network:
    external: true
    name: nginx_default
